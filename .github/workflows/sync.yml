name: Sync with ingadhoc

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Sync fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ingadhoc/reporting-engine.git
          git fetch upstream
          git merge upstream/13.0 --allow-unrelated-histories || echo "No changes"
          git push origin 13.0 || echo "Nothing to push"
